name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # SpecTrace posts the traceability comment on the PR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore RoomBooking.sln
          dotnet tool restore

      # Traceability gaps and unreviewed spec changes break the build here, not only in the report.
      - name: Build
        run: dotnet build RoomBooking.sln -c Release --no-restore -warnaserror:ST0003,ST0004,ST0005,ST0010,ST0011,ST0015

      - name: Test
        run: dotnet test RoomBooking.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Traceability report
        if: always()
        uses: amondejar/spec-trace@v0.6.0
        with:
          test-results: TestResults
          fail-on-gaps: "true"
          fail-on-drift: "true"
